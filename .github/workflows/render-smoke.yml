name: Render production smoke test

on:
  push:
    paths:
      - '.github/workflows/render-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check homepage and health
        run: |
          set -euo pipefail
          home=$(curl --retry 4 --retry-delay 5 --retry-all-errors -sS -o /tmp/home.html -w '%{http_code}' https://si-base.onrender.com/)
          echo "home_status=$home"
          test "$home" = "200"
          grep -q "SI BASE" /tmp/home.html
          grep -q "telegram-web-app.js" /tmp/home.html

          health=$(curl --retry 4 --retry-delay 5 --retry-all-errors -sS -o /tmp/health.json -w '%{http_code}' https://si-base.onrender.com/api/health)
          echo "health_status=$health"
          cat /tmp/health.json
          test "$health" = "200"
          grep -q '"ok":true' /tmp/health.json

      - name: Verify protected APIs reject anonymous traffic
        run: |
          set -euo pipefail

          chat=$(curl -sS -o /tmp/chat.json -w '%{http_code}' \
            -X POST https://si-base.onrender.com/api/chat \
            -H 'content-type: application/json' \
            --data '{"model":"qwen","messages":[{"role":"user","content":"OK"}]}')
          echo "chat_no_auth=$chat"
          cat /tmp/chat.json
          test "$chat" = "401"

          auth=$(curl -sS -o /tmp/auth.json -w '%{http_code}' https://si-base.onrender.com/api/auth/telegram)
          echo "auth_no_auth=$auth"
          cat /tmp/auth.json
          test "$auth" = "401"

          printf 'SI BASE test file' >/tmp/test.txt
          files=$(curl -sS -o /tmp/files.json -w '%{http_code}' \
            -X POST https://si-base.onrender.com/api/files \
            -F file=@/tmp/test.txt)
          echo "files_no_auth=$files"
          cat /tmp/files.json
          test "$files" = "401"

          products=$(curl -sS -o /tmp/products.json -w '%{http_code}' https://si-base.onrender.com/api/tribute/products)
          echo "tribute_products_no_auth=$products"
          cat /tmp/products.json
          test "$products" = "401"

      - name: Verify Tribute signature is required
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/tribute.json -w '%{http_code}' \
            -X POST https://si-base.onrender.com/api/tribute/webhook \
            -H 'content-type: application/json' \
            --data '{"name":"new_digital_product","payload":{"telegram_user_id":1,"product_name":"SI BASE PLUS"}}')
          echo "tribute_no_signature=$code"
          cat /tmp/tribute.json
          test "$code" = "401"

      - name: Measure Render backend burst throughput
        run: |
          set -euo pipefail
          rm -f /tmp/health-burst-*.txt
          start=$(date +%s%3N)
          seq 1 200 | xargs -I{} -P20 bash -c '
            code=$(curl --max-time 20 -sS -o /dev/null -w "%{http_code}" https://si-base.onrender.com/api/health || true)
            echo "$code" > /tmp/health-burst-{}.txt
          '
          end=$(date +%s%3N)
          elapsed_ms=$((end-start))
          ok=$(grep -l '^200$' /tmp/health-burst-*.txt 2>/dev/null | wc -l | tr -d ' ' || true)
          other=$((200-ok))
          rpm=$((ok*60000/elapsed_ms))
          echo "backend_burst_total=200"
          echo "backend_parallelism=20"
          echo "backend_ok=$ok"
          echo "backend_other=$other"
          echo "backend_elapsed_ms=$elapsed_ms"
          echo "backend_observed_effective_rpm=$rpm"
          test "$ok" = "200"

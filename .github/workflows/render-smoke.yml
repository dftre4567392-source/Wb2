name: Render production smoke test

on:
  push:
    paths:
      - '.github/workflows/render-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check homepage and health
        run: |
          set -euo pipefail
          home=$(curl --retry 4 --retry-delay 5 --retry-all-errors -sS -o /tmp/home.html -w '%{http_code}' https://si-base.onrender.com/)
          echo "home_status=$home"
          test "$home" = "200"
          grep -q "SI BASE" /tmp/home.html

          health=$(curl --retry 4 --retry-delay 5 --retry-all-errors -sS -o /tmp/health.json -w '%{http_code}' https://si-base.onrender.com/api/health)
          echo "health_status=$health"
          cat /tmp/health.json
          test "$health" = "200"

      - name: Check all configured AI models
        run: |
          set -euo pipefail
          models=(qwen deepseek gpt gemini grok claude)
          : > /tmp/model-results.tsv
          for model in "${models[@]}"; do
            start=$(date +%s%3N)
            code=$(curl --max-time 55 -sS -o "/tmp/${model}.json" -w '%{http_code}' \
              -X POST https://si-base.onrender.com/api/chat \
              -H 'content-type: application/json' \
              --data "{\"model\":\"${model}\",\"messages\":[{\"role\":\"user\",\"content\":\"Ответь ровно: OK\"}]}" || true)
            end=$(date +%s%3N)
            ms=$((end-start))
            body=$(tr '\n' ' ' < "/tmp/${model}.json" | head -c 500)
            printf '%s\t%s\t%s\t%s\n' "$model" "$code" "$ms" "$body" | tee -a /tmp/model-results.tsv
          done
          echo '--- model results ---'
          cat /tmp/model-results.tsv

      - name: Check text file upload
        run: |
          set -euo pipefail
          printf 'SI BASE test file' >/tmp/test.txt
          code=$(curl --retry 2 --retry-delay 3 --retry-all-errors -sS -o /tmp/file.json -w '%{http_code}' \
            -X POST https://si-base.onrender.com/api/files \
            -F file=@/tmp/test.txt)
          echo "file_status=$code"
          cat /tmp/file.json
          test "$code" = "200"
          grep -q "SI BASE test file" /tmp/file.json

      - name: Measure Render backend burst throughput
        run: |
          set -euo pipefail
          rm -f /tmp/health-burst-*.txt
          start=$(date +%s%3N)
          seq 1 200 | xargs -I{} -P20 bash -c '
            code=$(curl --max-time 20 -sS -o /dev/null -w "%{http_code}" https://si-base.onrender.com/api/health || true)
            echo "$code" > /tmp/health-burst-{}.txt
          '
          end=$(date +%s%3N)
          elapsed_ms=$((end-start))
          ok=$(grep -l '^200$' /tmp/health-burst-*.txt 2>/dev/null | wc -l | tr -d ' ' || true)
          other=$((200-ok))
          rpm=$((ok*60000/elapsed_ms))
          echo "backend_burst_total=200"
          echo "backend_parallelism=20"
          echo "backend_ok=$ok"
          echo "backend_other=$other"
          echo "backend_elapsed_ms=$elapsed_ms"
          echo "backend_observed_effective_rpm=$rpm"

      - name: Controlled Qwen burst test when provider is available
        run: |
          set -euo pipefail
          probe=$(curl --max-time 55 -sS -o /tmp/qwen-probe.json -w '%{http_code}' \
            -X POST https://si-base.onrender.com/api/chat \
            -H 'content-type: application/json' \
            --data '{"model":"qwen","messages":[{"role":"user","content":"Ответь ровно: OK"}]}' || true)
          echo "qwen_probe_status=$probe"
          if [ "$probe" != "200" ]; then
            echo "ai_burst_skipped=provider_not_ready"
            cat /tmp/qwen-probe.json
            exit 0
          fi

          rm -f /tmp/ai-burst-*.txt
          start=$(date +%s%3N)
          seq 1 20 | xargs -I{} -P5 bash -c '
            code=$(curl --max-time 55 -sS -o /tmp/ai-burst-{}.json -w "%{http_code}" \
              -X POST https://si-base.onrender.com/api/chat \
              -H "content-type: application/json" \
              --data "{\"model\":\"qwen\",\"messages\":[{\"role\":\"user\",\"content\":\"Ответь ровно: OK\"}]}" || true)
            echo "$code" > /tmp/ai-burst-{}.txt
          '
          end=$(date +%s%3N)
          elapsed_ms=$((end-start))
          ok=$(grep -l '^200$' /tmp/ai-burst-*.txt 2>/dev/null | wc -l | tr -d ' ' || true)
          rate429=$(grep -l '^429$' /tmp/ai-burst-*.txt 2>/dev/null | wc -l | tr -d ' ' || true)
          other=$((20-ok-rate429))
          rpm=$((ok*60000/elapsed_ms))
          echo "ai_burst_total=20"
          echo "ai_burst_parallelism=5"
          echo "ai_burst_ok=$ok"
          echo "ai_burst_429=$rate429"
          echo "ai_burst_other=$other"
          echo "ai_burst_elapsed_ms=$elapsed_ms"
          echo "ai_observed_effective_rpm=$rpm"

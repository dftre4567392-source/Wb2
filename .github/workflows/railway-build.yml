name: SI BASE build and security check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install
      - name: Enforce dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Security and protected API tests
        run: node --experimental-default-type=module --test tests/security.test.js
      - name: Build
        run: npm run build
